apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: roankessels/codesnap-ai-service:c04716591434d31de9577a341bafd7713d74e80c
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOGFIRE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logfire-secrets
                  key: write-token
            - name: LOGFIRE_SERVICE_NAME
              value: "ai-service"

            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: google_api_key
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
